name: Publicar atualização do Planilhador

on:
  push:
    branches:
      - main
    paths:
      - "release_queue/**"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Ler metadados da versão
        shell: bash
        run: |
          META=$(find release_queue -maxdepth 1 -name '*.json' -type f | sort | tail -n 1)
          if [ -z "$META" ]; then
            echo "Nenhum metadado de versão encontrado em release_queue."
            exit 1
          fi
          python - "$META" <<'PY'
          import json, os, sys
          meta = json.load(open(sys.argv[1], encoding='utf-8'))
          version = meta['version']
          base_version = meta['base_version']
          base_asset = meta['base_asset']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"VERSION={version}\n")
              f.write(f"TAG=v{version}\n")
              f.write(f"BASE_VERSION={base_version}\n")
              f.write(f"BASE_ASSET={base_asset}\n")
              f.write(f"ASSET=Planilhador_Equipamentos_Update_v{version}.zip\n")
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(meta.get('notes', 'Atualização do Planilhador de Equipamentos'))
          PY

      - name: Reconstruir e validar código alterado
        shell: bash
        run: |
          PATCH="source_patch/$VERSION"
          test -d "$PATCH" || (echo "Patch não encontrado: $PATCH" && exit 1)
          PARTS=("$PATCH"/Planilhador.pyw.part*)
          if [ ! -e "${PARTS[0]}" ]; then
            echo "Partes do Planilhador.pyw não encontradas."
            exit 1
          fi
          cat "${PARTS[@]}" > Planilhador.pyw
          python -m py_compile Planilhador.pyw
          if [ -f "$PATCH/config/equipamentos.json" ]; then
            python -m json.tool "$PATCH/config/equipamentos.json" >/dev/null
          fi

      - name: Montar pacote de atualização
        shell: bash
        run: |
          PATCH="source_patch/$VERSION"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$BASE_VERSION/$BASE_ASSET"
          echo "Baixando base: $BASE_URL"
          curl -fL "$BASE_URL" -o base.zip
          rm -rf work
          mkdir work
          unzip -q base.zip -d work
          ROOT=$(find work -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$ROOT" || (echo "Pasta raiz não encontrada no pacote base" && exit 1)
          TARGET="work/Planilhador_Equipamentos_v$VERSION"
          if [ "$ROOT" != "$TARGET" ]; then
            mv "$ROOT" "$TARGET"
          fi
          cp -f Planilhador.pyw "$TARGET/Planilhador.pyw"
          cp -f "$PATCH/LEIA-ME.txt" "$TARGET/LEIA-ME.txt"
          cp -f "$PATCH/PUBLICAR_ATUALIZACAO_GITHUB.txt" "$TARGET/PUBLICAR_ATUALIZACAO_GITHUB.txt"
          cp -f "$PATCH/TESTE_RAPIDO.txt" "$TARGET/TESTE_RAPIDO.txt"
          cp -f "$PATCH/update_manifest.json" "$TARGET/update_manifest.json"
          if [ -f "$PATCH/config/equipamentos.json" ]; then
            mkdir -p "$TARGET/config"
            cp -f "$PATCH/config/equipamentos.json" "$TARGET/config/equipamentos.json"
          fi
          (cd work && zip -qr "../$ASSET" "Planilhador_Equipamentos_v$VERSION")
          sha256sum "$ASSET" | awk '{print $1 "  " ENVIRON["ASSET"]}' > "$ASSET.sha256"

      - name: Publicar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Planilhador de Equipamentos v$VERSION" --notes-file release_notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --title "Planilhador de Equipamentos v$VERSION" --notes-file release_notes.md
          fi
