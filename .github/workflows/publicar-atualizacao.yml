name: Publicar atualização do Planilhador

on:
  push:
    branches:
      - main
    paths:
      - "release_queue/**"

permissions:
  contents: write

env:
  BOOTSTRAP_VERSION: "0.4.0"
  BOOTSTRAP_ASSET: "Planilhador_Equipamentos_Update_v0.4.0.zip"

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler metadados da versão
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          import json, os, re
          from pathlib import Path

          items = []
          for path in Path('release_queue').glob('*.json'):
              try:
                  meta = json.loads(path.read_text(encoding='utf-8'))
                  version = str(meta.get('version') or '')
                  nums = tuple(int(x) for x in re.findall(r'\d+', version))
                  if nums:
                      items.append((nums, path, meta))
              except Exception:
                  pass
          if not items:
              raise SystemExit('Nenhum metadado de versão válido encontrado em release_queue.')
          items.sort(key=lambda item: item[0])
          _, path, meta = items[-1]
          version = meta['version']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"VERSION={version}\n")
              f.write(f"TAG=v{version}\n")
              f.write(f"UPDATE_ASSET=Planilhador_Equipamentos_Update_v{version}.zip\n")
              f.write(f"EXE_ASSET=Planilhador_Equipamentos_EXE_v{version}.zip\n")
          Path('release_notes.md').write_text(meta.get('notes', 'Atualização do Planilhador de Equipamentos'), encoding='utf-8')
          print(f'Fila selecionada: {path} -> v{version}')
          '@ | Set-Content -Encoding UTF8 .read_meta.py
          python .read_meta.py

      - name: Reconstruir e validar código
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $patch = "source_patch/$env:VERSION"
          if (-not (Test-Path $patch)) { throw "Patch não encontrado: $patch" }
          if (Test-Path "$patch/build_patch_fix.py") {
            python "$patch/build_patch_fix.py"
          } elseif (Test-Path "$patch/build_patch.py") {
            python "$patch/build_patch.py"
          } else {
            throw "Gerador do Planilhador não encontrado em $patch"
          }
          if (-not (Test-Path "Planilhador.pyw")) { throw "Planilhador.pyw não foi gerado" }

          @'
          import os
          from pathlib import Path
          source = Path('Planilhador.pyw').read_text(encoding='utf-8')
          expected = f'APP_VERSION = "{os.environ["VERSION"]}"'
          if expected not in source:
              raise SystemExit(f'VERSÃO INCORRETA NO CÓDIGO GERADO. Esperado: {expected}')
          print('Versão confirmada no fonte:', os.environ['VERSION'])
          '@ | Set-Content -Encoding UTF8 .verify_version.py
          python .verify_version.py

          python -m py_compile Planilhador.pyw
          if (-not (Test-Path "$patch/Atualizador.pyw")) { throw "Atualizador.pyw não encontrado em $patch" }
          python -m py_compile "$patch/Atualizador.pyw"

      - name: Obter recursos embutidos
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force bootstrap | Out-Null
          gh release download "v$env:BOOTSTRAP_VERSION" --repo "$env:GITHUB_REPOSITORY" --pattern "$env:BOOTSTRAP_ASSET" --dir bootstrap
          Expand-Archive -Path "bootstrap/$env:BOOTSTRAP_ASSET" -DestinationPath bootstrap/extracted -Force
          $root = Get-ChildItem bootstrap/extracted -Directory | Select-Object -First 1
          if (-not $root) { throw "Raiz do pacote base não encontrada" }
          if (-not (Test-Path (Join-Path $root.FullName "config"))) { throw "config não encontrado no pacote base" }
          if (-not (Test-Path (Join-Path $root.FullName "modelos"))) { throw "modelos não encontrado no pacote base" }
          "RESOURCE_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instalar ferramentas de build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywin32

      - name: Gerar executáveis Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $configArg = "$env:RESOURCE_ROOT\config;config"
          $modelsArg = "$env:RESOURCE_ROOT\modelos;modelos"

          # Sem --icon: preserva o ícone padrão azul do Tk, que é o visual
          # aprovado pelo usuário e já aparecia corretamente antes da v0.4.6.
          pyinstaller --noconfirm --clean --onefile --windowed --name Planilhador `
            --add-data "$configArg" `
            --add-data "$modelsArg" `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import win32timezone `
            Planilhador.pyw

          pyinstaller --noconfirm --clean --onefile --windowed --name Atualizador `
            "source_patch/$env:VERSION/Atualizador.pyw"

          if (-not (Test-Path "dist/Planilhador.exe")) { throw "Planilhador.exe não foi gerado" }
          if (-not (Test-Path "dist/Atualizador.exe")) { throw "Atualizador.exe não foi gerado" }
          Get-Item dist/Planilhador.exe, dist/Atualizador.exe | Select-Object Name, Length

      - name: Montar distribuição limpa
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $folderName = "Planilhador_Equipamentos_v$env:VERSION"
          $cleanRoot = Join-Path "package_clean" $folderName
          $updateRoot = Join-Path "package_update" $folderName
          New-Item -ItemType Directory -Force $cleanRoot | Out-Null
          New-Item -ItemType Directory -Force $updateRoot | Out-Null

          foreach ($root in @($cleanRoot, $updateRoot)) {
            Copy-Item dist/Planilhador.exe (Join-Path $root "Planilhador.exe") -Force
            Copy-Item dist/Atualizador.exe (Join-Path $root "Atualizador.exe") -Force
            Copy-Item "source_patch/$env:VERSION/LEIA-ME.txt" (Join-Path $root "LEIA-ME.txt") -Force
          }

          $shim = "source_patch/$env:VERSION/migration/Planilhador.pyw"
          if (Test-Path $shim) {
            Copy-Item $shim (Join-Path $updateRoot "Planilhador.pyw") -Force
          }

          Compress-Archive -Path $cleanRoot -DestinationPath $env:EXE_ASSET -CompressionLevel Optimal -Force
          Compress-Archive -Path $updateRoot -DestinationPath $env:UPDATE_ASSET -CompressionLevel Optimal -Force

          foreach ($asset in @($env:EXE_ASSET, $env:UPDATE_ASSET)) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
            "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          }

          Write-Host "Conteúdo da pasta limpa:"
          Get-ChildItem $cleanRoot | Select-Object Name, Length
          if ((Get-ChildItem $cleanRoot -File).Count -ne 3) {
            throw "A distribuição limpa deve conter exatamente 3 arquivos."
          }

      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(
            $env:UPDATE_ASSET,
            "$env:UPDATE_ASSET.sha256",
            $env:EXE_ASSET,
            "$env:EXE_ASSET.sha256"
          )

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true

          if ($releaseExists) {
            gh release upload $env:TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:TAG --title "Planilhador de Equipamentos v$env:VERSION" --notes-file release_notes.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG @assets --repo $env:GITHUB_REPOSITORY --title "Planilhador de Equipamentos v$env:VERSION" --notes-file release_notes.md
          }
